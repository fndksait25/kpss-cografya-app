name: Android App Build (TWA)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Java'yı biz kendimiz kuruyoruz (Bubblewrap sormasın diye)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      # 2. Bubblewrap'i "Kandırma" Adımı: Ayar dosyasını önceden oluşturuyoruz
      - name: Configure Bubblewrap Silently
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"${JAVA_HOME}\",\"androidSdkPath\":\"${ANDROID_SDK_ROOT}\"}" > ~/.bubblewrap/config.json
          echo "Bubblewrap konfigüre edildi: JDK ve SDK yolları tanıtıldı."

      # 3. Paketleme İşlemi
      - name: Build Android App Bundle (.aab)
        run: |
          # Artık JDK sormayacak, doğrudan işe girişecek
          bubblewrap init --manifest=https://cografya25.netlify.app/manifest.json --allowlist=https://cografya25.netlify.app/ --yes
          bubblewrap build --signingKeyPath=./my-release-key.keystore --signingKeyAlias=${{ secrets.KEY_ALIAS }} --yes
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: ./*.aab
