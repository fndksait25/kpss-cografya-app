name: Android-Build-Final

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # İşte sihirli dokunuş: Node 18! (Yeni sürümler çöktüğü için buna döndük)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build Android App Bundle
        run: |
          # Node 18 sayesinde --yes parametresi artık çökmeyecek
          bubblewrap build --project=twa-manifest.json --yes
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kpss-cografya-aab
          path: ./*.aab
