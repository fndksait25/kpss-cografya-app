name: Android App Build (TWA)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # GitHub'ın istediği o meşhur "Zorla Node 24 kullan" komutu
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5 # En son sürüm v5

      - name: Setup Node.js
        uses: actions/setup-node@v5 # En son sürüm v5
        with:
          node-version: '24' # Doğrudan Node.js 24'e geçtik

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build Android App Bundle (.aab)
        run: |
          bubblewrap init --manifest=https://cografya25.netlify.app/manifest.json --allowlist=https://cografya25.netlify.app/
          bubblewrap build --signingKeyPath=./my-release-key.keystore --signingKeyAlias=${{ secrets.KEY_ALIAS }}
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v5 # v5'e yükselttik
        with:
          name: release-aab
          path: ./*.aab
